# Documentation schema for learnings written by fx-compound.
# Canonical frontmatter contract for docs/solutions/.
# Adapted from EveryInc's compound-engineering ce-compound schema; enums
# retargeted from a Rails shop to this stack (Expo/React Native, Supabase +
# Drizzle, the frxnls Claude Code plugin).
#
# Two tracks, keyed on problem_type:
#   Bug track       — a defect or failure that was diagnosed and fixed
#   Knowledge track — guidance, pattern, decision, or convention worth keeping
#
# Both tracks share the same required core fields and differ only in which
# extra fields are required vs optional (see track_rules).

# --- Track classification ---------------------------------------------------
tracks:
  bug:
    description: "Defects, failures, and errors that were diagnosed and fixed"
    problem_types:
      - build_error
      - test_failure
      - runtime_error
      - performance_issue
      - database_issue
      - security_issue
      - ui_bug
      - integration_issue
      - logic_error
  knowledge:
    description: "Practices, patterns, conventions, decisions, workflow improvements, and documentation"
    problem_types:
      - best_practice
      - documentation_gap
      - workflow_issue
      - developer_experience
      - architecture_pattern
      - design_pattern
      - tooling_decision
      - convention

# --- Fields required by BOTH tracks -----------------------------------------
required_fields:
  module:
    type: string
    description: "Module or area affected (free text — e.g. 'reservations screen', 'drizzle migrations', 'fx-ship skill')"

  date:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    description: "Date documented (YYYY-MM-DD)"

  problem_type:
    type: enum
    values:
      - build_error
      - test_failure
      - runtime_error
      - performance_issue
      - database_issue
      - security_issue
      - ui_bug
      - integration_issue
      - logic_error
      - developer_experience
      - workflow_issue
      - best_practice
      - documentation_gap
      - architecture_pattern
      - design_pattern
      - tooling_decision
      - convention
    description: "Primary category — determines track (bug vs knowledge). Prefer the narrowest applicable value; best_practice is the fallback when no narrower knowledge-track value fits."

  component:
    type: enum
    values:
      - expo_screen          # an Expo Router screen / route
      - rn_component         # a reusable React Native component
      - navigation           # expo-router / navigation wiring
      - native_module        # native iOS/Android module or config plugin
      - api_route            # Expo Router API route / server handler
      - server               # backend / edge function
      - database             # Supabase / Postgres schema, RLS, queries
      - migration            # Drizzle migration
      - auth                 # authentication / authorization
      - payments             # billing / payments
      - state_management     # client state, stores, context
      - data_fetching        # network requests, caching, React Query/SWR
      - styling              # NativeWind / Tailwind / theming
      - ci_cd                # EAS workflows, GitHub Actions
      - skill_or_agent       # a frxnls plugin skill or agent
      - tooling              # build/dev tooling, scripts
      - testing              # test framework / harness
      - documentation        # docs, README, AGENTS.md
      - development_workflow # local dev, worktrees, simulators
    description: "Component involved. Prefer the narrowest applicable value."

  severity:
    type: enum
    values:
      - critical
      - high
      - medium
      - low
    description: "Impact severity"

# --- Track-specific rules ----------------------------------------------------
track_rules:
  bug:
    required:
      symptoms:
        type: array[string]
        min_items: 1
        max_items: 5
        description: "Observable symptoms such as errors or broken behavior"
      root_cause:
        type: enum
        values:
          - missing_index
          - missing_migration
          - missing_relation
          - wrong_api
          - scope_issue
          - race_condition
          - async_timing
          - memory_leak
          - config_error
          - logic_error
          - type_error
          - test_isolation
          - missing_validation
          - missing_permission
          - rls_policy
          - platform_specific
          - stale_cache
          - dependency_mismatch
          - missing_workflow_step
          - inadequate_documentation
          - missing_tooling
          - incomplete_setup
        description: "Fundamental technical cause of the problem"
      resolution_type:
        type: enum
        values:
          - code_fix
          - migration
          - config_change
          - test_fix
          - dependency_update
          - native_rebuild
          - environment_setup
          - workflow_improvement
          - documentation_update
          - tooling_addition
        description: "Type of fix applied"

  knowledge:
    optional:
      applies_when:
        type: array[string]
        max_items: 5
        description: "Conditions or situations where this guidance applies"
      symptoms:
        type: array[string]
        max_items: 5
        description: "Observable gaps or friction that prompted this guidance (optional for knowledge track)"
      root_cause:
        type: enum
        values:
          - missing_index
          - missing_migration
          - missing_relation
          - wrong_api
          - scope_issue
          - race_condition
          - async_timing
          - memory_leak
          - config_error
          - logic_error
          - type_error
          - test_isolation
          - missing_validation
          - missing_permission
          - rls_policy
          - platform_specific
          - stale_cache
          - dependency_mismatch
          - missing_workflow_step
          - inadequate_documentation
          - missing_tooling
          - incomplete_setup
        description: "Underlying cause, if there is a specific one (optional for knowledge track)"
      resolution_type:
        type: enum
        values:
          - code_fix
          - migration
          - config_change
          - test_fix
          - dependency_update
          - native_rebuild
          - environment_setup
          - workflow_improvement
          - documentation_update
          - tooling_addition
        description: "Type of change, if applicable (optional for knowledge track)"

# --- Fields optional for BOTH tracks ----------------------------------------
optional_fields:
  related_components:
    type: array[string]
    description: "Other components involved"

  tags:
    type: array[string]
    max_items: 8
    description: "Search keywords, lowercase and hyphen-separated"

  versions:
    type: string
    description: "Relevant version pins (e.g. 'expo 53, drizzle-orm 0.36'). Free text — only when a version is load-bearing to the learning."

# --- Validation rules --------------------------------------------------------
validation_rules:
  - "Determine track from problem_type using the tracks section above"
  - "All shared required_fields must be present"
  - "Bug-track required fields (symptoms, root_cause, resolution_type) must be present on bug-track docs"
  - "Knowledge-track docs have no additional required fields beyond the shared ones"
  - "Enum fields must match allowed values exactly"
  - "Array fields must respect min_items/max_items when specified"
  - "date must match YYYY-MM-DD format"
  - "tags should be lowercase and hyphen-separated"
  - "Array-of-strings frontmatter items (symptoms, applies_when, tags, related_components, or any future array field) must be wrapped in double quotes when the value starts with a YAML reserved indicator (`, [, *, &, !, |, >, %, @, ?) or contains the substring `: ` — otherwise strict YAML parsers reject the file"
